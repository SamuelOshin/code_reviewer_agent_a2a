# docker-compose.yml

services:
  # ============================================================================
  # Code Review Agent Service
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: code_review_agent
    ports:
      - "8000:8000"
    # Secrets and settings come from .env (copy .env.example). Compose does not
    # list each variable, so every setting the app reads can be set there.
    env_file:
      - .env
    environment:
      # Fixed for the container; overrides anything in .env
      - ENVIRONMENT=production
    healthcheck:
      # Non-2xx responses raise, so an unhealthy /health fails the check
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - code_review_network

networks:
  code_review_network:
    driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# 1. Create .env with the required variables:
#    cp .env.example .env
#    # Edit .env: GITHUB_TOKEN and GITHUB_WEBHOOK_SECRET are required, plus the
#    # API key for the LLM provider you choose
#
# 2. Build and run:
#    docker compose up --build
#
# 3. Run in background:
#    docker compose up -d
#
# 4. Check health:
#    docker compose ps
#    curl http://localhost:8000/health
#
# 5. View logs:
#    docker compose logs -f app
#
# 6. Stop:
#    docker compose down
#
# Tests are not part of the image. Run them on the host: uv run pytest
#
# ============================================================================
