name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values: the settings class needs them at import time, and no test
      # talks to a real service.
      GITHUB_TOKEN: dummy
      GITHUB_WEBHOOK_SECRET: dummy
      # Must be at least 32 characters (P1-07)
      API_KEY: ci-dummy-api-key-not-a-secret-000000
      SECRET_KEY: dummy
      GOOGLE_API_KEY: dummy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run --frozen ruff check .

      - name: Tests with coverage
        run: uv run --frozen pytest -q --cov=app --cov-report=term-missing

      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements-audit.txt"
          uv run --frozen pip-audit -r "$RUNNER_TEMP/requirements-audit.txt" --no-deps --disable-pip
